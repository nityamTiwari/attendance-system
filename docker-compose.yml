
  services:

    mysql:
      image: mysql:8.4
      container_name: attendance-mysql
      restart: always

      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: attendance_db
        MYSQL_USER: attendance_user
        MYSQL_PASSWORD: Ayush@132

      ports:
        - "3306:3306"

      volumes:
        - mysql-data:/var/lib/mysql

      healthcheck:
        test: ["CMD","mysqladmin","ping","-h","localhost","-u","attendance_user","-pAyush@132"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 20s

    attendance-app:
      build: .
      container_name: attendance-app
      restart: always

      ports:
        - "8080:8080"

      depends_on:
         mysql:
           condition: service_healthy

      environment:
        SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
        DB_URL: ${DB_URL}
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET:  ${JWT_SECRET}
        JWT_EXPIRATION: ${JWT_EXPIRATION}

  volumes:
    mysql-data:


